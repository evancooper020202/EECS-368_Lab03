<html>

<head>
    <h1>Practice 2: CSS Update</h1>
</head>

<body>
    Red: (0-255)<br>
    <input type="number" id='red' value='0'><br>

    Green: (0-255)<br>
    <input type="number" id='green' value='0'><br>

    Blue: (0-255)<br>
    <input type="number" id='blue' value='0'><br>

    Border Width<br>
    <input type="number" id='width' value='1'><br>

    <button onclick='changeStyle()'>Change</button><br><br>

    <div id='box' style="border: 1px solid black line: padding: 10px;">
	    <div>
    <script>
	    function changeStyle() {
		    var r = document.getElementById("red").value;
		    var g = document.getElementById("green").value;
		    var b = document.getElementById("blue").value;
		    var w = document.getElementById("width").value;

		    var box document.getElementById("box");
		    box.style.color = "rgb(" + r + ", " + g + "," + b + ")";
		    box.style.borderWidth = w + "px";
	    }



	<script>
		   

</body>
</html>
