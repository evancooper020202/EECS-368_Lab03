<html>

<head>
    <h1>Practice 2: CSS Update</h1>
</head>

<body>
    Color Changes?<br>
    <input type="color" id='myColor' oninput='changeStyle()'><br>

    Width changes<br>
    <input type='number' id='myWidth' value='200' oninput='changeStyle()'><br>

    Target<br>
    <div id='box' style='border: 1px solid black; padding: 10px; width 200x;'>
    </div>

    <script>
	    function changeStyle() {
		    var color = document.getElementById("myColor").value;
		    var width = document.getElementById("myWidth").value;
		    document.getElementById("box").style.color = color;
		    document.getElementById("box").style.width = width + 'px';
	    }
	<script>
		   

</body>
</html>
